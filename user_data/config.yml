data_options:
  DB_TRANSACTIONS_FILE_NAME: transactions.db
script_options:
  CLEAN_START: false
  DEBUG: true
  LOG_FILE: trades.txt
  LOG_TRADES: false
  MSG_TELEGRAM: true
  # Telegram portfolio heartbeat in cycles (cycle_interval=10s):
  # 180 ~= 30min with open positions, 1440 ~= 4h while idle.
  # Trade, error and session notifications are always immediate.
  REPORT_ACTIVE_CYCLES: 180
  REPORT_IDLE_CYCLES: 1440
  TEST_MODE: true
  UTA_MODE: true
trading_options:
  CHANGE_IN_PRICE: 2.5
  # 24h quote-volume gate (USDT) calibrated for Bitget spot scale:
  # majors are ~10-250M; <0.3-0.5M = dead/stable pairs that produce fake pumps.
  COINS_MAX_VOLUME: 50000000000
  COINS_MIN_VOLUME: 200000
  # Market regime filter: no new buys when BTC is falling fast
  # (>=1.5% in the ~3min window) or is in a 24h downtrend (<=-3%)
  MARKET_FILTER_ENABLED: true
  MARKET_FILTER_SYMBOL: BTCUSDT
  MARKET_MAX_24H_DROP_PCT: -3
  MARKET_MAX_WINDOW_DROP_PCT: -1.5
  # post-sell cooloff base in minutes; result multipliers apply on top
  # (LOSS x2 -> 30 min, SMALL_PROFIT x1.5 -> ~22 min, else 15 min)
  COOLOFF_BASE_MINUTES: 15
  COOLOFF_MULTIPLIER_LOSS: 2
  COOLOFF_MULTIPLIER_SMALL_PROFIT: 1.5
  # stop buying a coin that keeps losing today (sells never blocked):
  # >= 3 losing trades OR net realized P&L <= -4% of TRADE_TOTAL
  MAX_LOSSES_PER_SYMBOL_PER_DAY: 3
  SYMBOL_DAILY_LOSS_LIMIT_PCT: 4
  CUSTOM_LIST: true
  # CoinGecko market-cap-ranked list size (refreshed every 6h by importer)
  TICKERS_NUMBER: 300
  CUSTOM_LIST_AUTORELOAD: true
  FIATS:
  - EURUSDT
  - GBPUSDT
  - JPYUSDT
  - USDUSDT
  - DAIUSDT
  - AUDUSDT
  - BUSDUSDT
  - USDTVAI
  - USDTDAI
  - USDCUSDT
  - USTUSDT
  - USDTBVND
  - USDTBKRW
  - USDSUSDT
  - USDSBUSDT
  - PAXUSDT
  - BNBBULLUSDT
  - BNBBEARUSDT
  - BULLUSDT
  - BEARUSDT
  - ETHBULLUSDT
  - ETHBEARUSDT
  - EOSBULLUSDT
  - EOSBEARUSDT
  - XRPBULLUSDT
  - XRPBEARUSDT
  - 1INCHUPUSDT
  - AAVEUPUSDT
  - VENUSDT
  - XRPUPUSDT
  - LINKUPUSDT
  - DOTUPUSDT
  - UNIUPUSDT
  - FILUPUSDT
  - EOSUPUSDT
  - BNBUPUSDT
  - SUSHIUPUSDT
  - XLMUPUSDT
  - XTZUPUSDT
  - YFIUPUSDT
  - YFIDOWNUSDT
  MAX_PORTFOLIO_EXPOSURE: 10000
  MAX_PORTFOLIO_VALUE: 1000
  MIN_POSITIONS_CONCENTRATION: 3
  PAIR_WITH: USDT
  PERFORMANCE_RISK_THRESHOLD: -15
  # ~10s main-loop cadence (was 60s) - faster entries and trailing exits
  cycle_interval: 10
  # price snapshots kept for the detector window:
  # TIME_DIFFERENCE x RECHECK_INTERVAL x cycle_interval ~= 3 min
  RECHECK_INTERVAL: 18
  REINVEST_PROFITS: true
  SELL_ON_SIGNAL_ONLY: false
  SESSION_STOP_LOSS: -2
  SESSION_TAKE_PROFIT: 5
  SESSION_TPSL_OVERRIDE: true
  SIGNALLING_MODULES:
  - import_bitget_tickers_coingecko
  STOP_LOSS: 3.0
  TAKE_PROFIT: 5.0
  TICKERS_LIST: tickerlists/tickers_bitget_USDT.txt
  TIME_DIFFERENCE: 1
  TRADE_SLOTS: 10
  TRADE_TOTAL: 500
  TRADING_FEE: 0.1
  TRAILING_STOP_LOSS: 1.0
  TRAILING_TAKE_PROFIT: 1.0
  USE_TRAILING_STOP_LOSS: true
