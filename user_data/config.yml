data_options:
  DB_TRANSACTIONS_FILE_NAME: transactions.db
script_options:
  CLEAN_START: false
  DEBUG: true
  LOG_FILE: trades.txt
  LOG_TRADES: false
  MSG_TELEGRAM: true
  # Telegram portfolio heartbeat in cycles (cycle_interval=10s):
  # 180 ~= 30min with open positions, 1440 ~= 4h while idle.
  # Trade, error and session notifications are always immediate.
  REPORT_ACTIVE_CYCLES: 180
  REPORT_IDLE_CYCLES: 1440
  TEST_MODE: true
  UTA_MODE: true
trading_options:
  CHANGE_IN_PRICE: 3.0
  # --- DIP-BUY MODE (validated on recorded ticks 2026-10-17..21) ---
  # Pump momentum was retired: on 5 days of real ticks every config lost.
  # The market mean-reverts, so we fade dumps instead: buy after a >=3%
  # range with a real net drop, price near the window minimum and the
  # last 2 ticks ticking up (buy the turn, not the falling knife).
  DIP_MODE_ENABLED: false
  DIP_DROP_PCT: -1.5
  DIP_NEAR_MIN_PCT: 0.5
  DIP_BOUNCE_TICKS: 2
  # --- pump-mode params (inactive while DIP_MODE_ENABLED) ---
  # min signed move (first->last snapshot in the window) for a signal -
  # range alone also fires on drops or fully retraced pumps (+0.00% gain)
  MIN_NET_GAIN_PCT: 1.0
  # dead-cat guard: last price must stay within 1.5% of the window max,
  # else the bounce already faded and we buy the retrace into a dump
  LAST_NEAR_MAX_PCT: 1.5
  # --- pump-signal quality filters (tick-replay study 2026-10-29) ---
  # the only combo positive in the coupled sim: real window volume,
  # an up-move already running before the window, favorable UTC hours
  PUMP_FILTER_ENABLED: true
  # >=5000 USDT traded inside the ~3min signal window
  PUMP_MIN_WINDOW_VOLUME: 5000
  # net % move over the 3min window BEFORE the signal window
  PUMP_MIN_PRETREND_PCT: 1.0
  # hour band DISABLED (0-24): the 2026-10-31 AINUSDT +61% run fired the
  # detector ~90x entirely outside 8-19 UTC - night mega-pumps were being
  # filtered out wholesale, the study's "toxic hours" finding was too
  # weak a basis for a hard gate
  PUMP_HOUR_START_UTC: 0
  PUMP_HOUR_END_UTC: 24
  # record every ~10s price snapshot to user_data/snapshots/*.csv.gz
  # (~20MB/day) - real tick data for later backtest/optimization
  SNAPSHOT_RECORD: true
  # 24h quote-volume gate (USDT) calibrated for Bitget spot scale:
  # majors are ~10-250M; <0.3-0.5M = dead/stable pairs that produce fake pumps.
  COINS_MAX_VOLUME: 50000000000
  COINS_MIN_VOLUME: 200000
  # Market regime filter DISABLED: this is a tail-event strategy -
  # ~93% of backtest PnL came from extreme-volatility (crash) days.
  # Blocking buys when BTC drops removes the strategy's entire edge.
  MARKET_FILTER_ENABLED: false
  MARKET_FILTER_SYMBOL: BTCUSDT
  MARKET_MAX_24H_DROP_PCT: -3
  MARKET_MAX_WINDOW_DROP_PCT: -1.5
  # post-sell cooloff base in minutes; result multipliers apply on top
  # (LOSS x2 -> 30 min, SMALL_PROFIT x1.5 -> ~22 min, else 15 min)
  COOLOFF_BASE_MINUTES: 15
  COOLOFF_MULTIPLIER_LOSS: 2
  COOLOFF_MULTIPLIER_SMALL_PROFIT: 1.5
  # stop buying a coin that keeps losing today (sells never blocked):
  # >= 3 losing trades OR net realized P&L <= -4% of TRADE_TOTAL
  MAX_LOSSES_PER_SYMBOL_PER_DAY: 3
  SYMBOL_DAILY_LOSS_LIMIT_PCT: 4
  CUSTOM_LIST: true
  # CoinGecko market-cap-ranked list size (refreshed every 6h by importer)
  TICKERS_NUMBER: 300
  CUSTOM_LIST_AUTORELOAD: true
  FIATS:
  - EURUSDT
  - GBPUSDT
  - JPYUSDT
  - USDUSDT
  - DAIUSDT
  - AUDUSDT
  - BUSDUSDT
  - USDTVAI
  - USDTDAI
  - USDCUSDT
  - USTUSDT
  - USDTBVND
  - USDTBKRW
  - USDSUSDT
  - USDSBUSDT
  - PAXUSDT
  - BNBBULLUSDT
  - BNBBEARUSDT
  - BULLUSDT
  - BEARUSDT
  - ETHBULLUSDT
  - ETHBEARUSDT
  - EOSBULLUSDT
  - EOSBEARUSDT
  - XRPBULLUSDT
  - XRPBEARUSDT
  - 1INCHUPUSDT
  - AAVEUPUSDT
  - VENUSDT
  - XRPUPUSDT
  - LINKUPUSDT
  - DOTUPUSDT
  - UNIUPUSDT
  - FILUPUSDT
  - EOSUPUSDT
  - BNBUPUSDT
  - SUSHIUPUSDT
  - XLMUPUSDT
  - XTZUPUSDT
  - YFIUPUSDT
  - YFIDOWNUSDT
  MAX_PORTFOLIO_EXPOSURE: 10000
  MAX_PORTFOLIO_VALUE: 1000
  MIN_POSITIONS_CONCENTRATION: 3
  PAIR_WITH: USDT
  PERFORMANCE_RISK_THRESHOLD: -15
  # ~10s main-loop cadence (was 60s) - faster entries and trailing exits
  cycle_interval: 10
  # price snapshots kept for the detector window:
  # TIME_DIFFERENCE x RECHECK_INTERVAL x cycle_interval ~= 3 min
  RECHECK_INTERVAL: 18
  REINVEST_PROFITS: true
  SELL_ON_SIGNAL_ONLY: false
  # daily risk guard: -2% session loss stops the bot; TP set to 100%
  # because backtest PnL is dominated by extreme-volatility days that
  # a 5% cap would cut off mid-run
  SESSION_STOP_LOSS: -5
  SESSION_TAKE_PROFIT: 100
  SESSION_TPSL_OVERRIDE: true
  SIGNALLING_MODULES:
  - import_bitget_tickers_coingecko
  # pump-mode exits: base SL 3%; trailing arms at TAKE_PROFIT +5%,
  # then 1% trail below max / 1% TTP spike above it
  STOP_LOSS: 3.0
  TAKE_PROFIT: 5.0
  TICKERS_LIST: tickerlists/tickers_bitget_USDT.txt
  TIME_DIFFERENCE: 1
  TRADE_SLOTS: 5
  TRADE_TOTAL: 500
  TRADING_FEE: 0.1
  TRAILING_STOP_LOSS: 1.0
  TRAILING_TAKE_PROFIT: 1.0
  USE_TRAILING_STOP_LOSS: true
