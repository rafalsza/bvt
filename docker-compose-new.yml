services:
  bvt-bot:
    build:
      context: .
      dockerfile: ./Dockerfile-bot
    restart: unless-stopped
    container_name: bvt_bot
    image: bvt_bot
    volumes:
      - "./user_data:/user_data"
      - "./bitget_volatility_trading_bot:/bitget_volatility_trading_bot"
    networks:
      - bvt

networks:
  bvt:
